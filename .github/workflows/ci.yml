name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sonic_media_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sonic_media_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sonic_media_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sonic_media_test
      JWT_SECRET: ci-only-secret-with-more-than-thirty-two-characters
      CORS_ORIGIN: http://127.0.0.1:3061
      MEDIA_STORAGE_ROOT: /tmp/sonic-media-ci
      APP_HOST: 127.0.0.1
      BACKEND_PORT: 3061
      DISABLE_MEDIA_WORKER: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend
      - run: mkdir -p "$MEDIA_STORAGE_ROOT"
      - run: npm run migrate --prefix backend
      - run: npm run migrate:check --prefix backend
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npm audit --prefix backend --audit-level=high
      - run: docker build --tag sonic-media-ci .
      - uses: gitleaks/gitleaks-action@v2
